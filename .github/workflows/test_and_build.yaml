name: test_and_build

on:
  push:
    branches: [ "main" ]


permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r pruebas/requirements.txt
          playwright install

    
      - name: Iniciar servidor local
        run: |
          start mvn spring-boot:run
        shell: cmd

      - name: Esperar a que el servidor esté activo
        run: |
          ping 127.0.0.1 -n 15 > nul

      - name: Ejecutar pruebas con Pytest y reporte de cobertura
        run: |
          python -m pytest -v --cov=. --cov-report=html --html=report.html
    