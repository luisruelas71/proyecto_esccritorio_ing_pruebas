name: Test and Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes NuGet
        run: nuget restore

      - name: Compilar Solución con MSBuild
        run: msbuild /p:Configuration=Debug

      - name: Configurar Node.js para Newman
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Iniciar IIS Express (Servidor Local WebForms)
        run: |
          $iisExpress = "C:\Program Files\IIS Express\iisexpress.exe"
          $sitePath = "$env:GITHUB_WORKSPACE\Crud.WebForm"
          Start-Process $iisExpress -ArgumentList "/path:`"$sitePath`" /port:44373"
        shell: powershell

      - name: Esperar a que el servidor esté activo
        run: Start-Sleep -Seconds 5
        shell: powershell

      - name: Ejecutar Pruebas de Postman con Newman
        run: |
          newman run crud.webform/pruebas_humo_api.json --env-var "BASE_URL_SCHEME=https" --env-var "BASE_URL_HOST=localhost:44373" --insecure