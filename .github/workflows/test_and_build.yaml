name: Test and Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configurar .NET para las pruebas MSTest
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar paquetes NuGet
        shell: powershell
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter packages.config |
            ForEach-Object { nuget restore $_.FullName -PackagesDirectory "$env:GITHUB_WORKSPACE\packages" }

      - name: Compilar Solución con MSBuild
        run: msbuild .\Crud.WebForm.slnx /p:Configuration=Debug

      - name: Restaurar proyectos de pruebas
        run: |
          dotnet restore .\TestProducto\TestProducto.csproj
          dotnet restore .\TestProductos\TestProductos.csproj

      - name: Ejecutar pruebas unitarias MSTest
        run: |
          dotnet test .\TestProducto\TestProducto.csproj --configuration Debug --no-restore --logger "trx;LogFileName=TestProducto.trx"
          dotnet test .\TestProductos\TestProductos.csproj --configuration Debug --no-restore --logger "trx;LogFileName=TestProductos.trx"

      - name: Configurar Node.js para Newman
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Iniciar IIS Express (Servidor Local WebForms)
        run: |
          $iisExpress = "C:\Program Files\IIS Express\iisexpress.exe"
          $sitePath = "$env:GITHUB_WORKSPACE\Crud.WebForm"
          Start-Process $iisExpress -ArgumentList "/path:`"$sitePath`" /port:44373"
        shell: powershell

      - name: Esperar a que el servidor esté activo
        run: |
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            try {
              Invoke-WebRequest -Uri "http://localhost:44373/vistas/Login/Login" -UseBasicParsing -TimeoutSec 5 | Out-Null
              $ready = $true
            } catch {
              $ready = $false
            }
          } while (-not $ready -and (Get-Date) -lt $deadline)
          if (-not $ready) {
            throw "IIS Express no respondió en el puerto 44373."
          }
        shell: powershell

      - name: Ejecutar Pruebas de Postman con Newman
        run: |
          newman run .\Crud.WebForm\pruebas_humo_api.json --env-var "baseUrl=http://localhost:44373"
