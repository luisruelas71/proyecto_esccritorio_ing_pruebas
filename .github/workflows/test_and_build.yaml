name: test_and_build

on:
  push:
    branches: [ "main" ]


permissions:
  contents: read

jobs:
  test_and_build:

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pruebas/requirements.txt
          playwright install

      - name: Iniciar servidor IIS Express
        shell: powershell
        run: |
          $rutaProyecto = "$env:GITHUB_WORKSPACE\Crud.WebForm"
           # Inicia IIS Express en segundo plano apuntando al puerto 8080
          Start-Process "C:\Program Files\IIS Express\iisexpress.exe" -ArgumentList "/path:$rutaProyecto /port:8080"  
           # Damos unos segundos para que el servidor encienda por completo
          Start-Sleep -Seconds 5

      - name: Test with pytest
        run: |
          python -m pytest -v --cov=. --cov-report=html --html=report.html
    