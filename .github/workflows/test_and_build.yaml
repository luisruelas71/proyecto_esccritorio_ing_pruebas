name: test_and_build

on:
  push:
    branches: [ "main" ]


permissions:
  contents: read

jobs:
  test_and_build:

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pruebas/requirements.txt
          playwright install

      - name: Iniciar servidor IIS Express
        shell: powershell
        run: |
          $rutaProyecto = "$env:GITHUB_WORKSPACE\Crud.WebForm"
           # Inicia IIS Express en segundo plano apuntando al puerto 8080
          Start-Process "C:\Program Files\IIS Express\iisexpress.exe" -ArgumentList "/path:$rutaProyecto /port:8080"  
           # Damos unos segundos para que el servidor encienda por completo
          Start-Sleep -Seconds 5

      - name: Test with pytest
        run: |
          python -m pytest pruebas/test_ui_consulta_usuarios.py -v --headed --slowmo 1000
          python -m pytest pruebas/test_ui_consulta_usuarios.py -v --cov=. --cov-report=term --cov-report=html --html=report.html
    
      - name: Iniciar IIS Express
        shell: pwsh
        run: |
          Start-Process `
          "${env:ProgramFiles}\IIS Express\iisexpress.exe" `
          -ArgumentList "/path:${env:GITHUB_WORKSPACE}\Crud.WebForm", "/port:8080"

      - name: Esperar servidor
        shell: pwsh
        run: |
          $url = "http://localhost:8080/vistas/Login/Login"
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5
            }
            catch {
              Start-Sleep -Seconds 3
            }
          }
          exit 0

      - name: Ejecutar pruebas UI
        run: |
          python -m pytest `
            pruebas/test_ui_login.py `
            pruebas/test_ui_consulta_usuarios.py `
            pruebas/test_ui_consulta_productos.py `
            -v