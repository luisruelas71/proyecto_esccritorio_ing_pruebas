name: Test and Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes NuGet
        run: nuget restore

      - name: Compilar Solución con MSBuild
        run: msbuild /p:Configuration=Debug

      - name: Configurar Node.js para Newman
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar Pruebas de Postman con Newman
        run: |
          newman run pruebas_humo_api.json --env-var "BASE_URL_SCHEME=https" --env-var "BASE_URL_HOST=localhost:44373" --insecure