name: test-and-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes .NET
        run: nuget restore Crud.WebForm.slnx

      - name: Compilar aplicación
        run: >
          msbuild Crud.WebForm.slnx
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /verbosity:minimal

      - name: Instalar dependencias Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pruebas/requirements.txt
          python -m playwright install chromium

      - name: Ejecutar pruebas unitarias
        run: |
          python -m pytest pruebas/test_unit_nombre.py pruebas/test_producto_cantidad.py -v


      - name: Iniciar IIS Express
        shell: pwsh
        run: |
          $iisExpress = "${env:ProgramFiles}\IIS Express\iisexpress.exe"
          $webRoot = Join-Path $env:GITHUB_WORKSPACE "Crud.WebForm"

          if (-not (Test-Path $iisExpress)) {
            throw "No se encontró IIS Express en $iisExpress"
          }

          Start-Process `
            -FilePath $iisExpress `
            -ArgumentList "/path:$webRoot", "/port:8080" `
            -PassThru

      - name: Esperar aplicación web
        shell: pwsh
        run: |
          $url = "http://127.0.0.1:8080/vistas/Login/Login"
          $timeout = [DateTime]::UtcNow.AddMinutes(2)

          do {
            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                Write-Host "La aplicación está disponible."
                exit 0
              }
            }
            catch {
              Start-Sleep -Seconds 3
            }
          } while ([DateTime]::UtcNow -lt $timeout)

          throw "La aplicación no respondió en $url"

      - name: Ejecutar pruebas UI
        run: |
          python -m pytest `
            pruebas/test_ui_login.py `
            pruebas/test_ui_consulta_usuarios.py `
            pruebas/test_ui_consulta_productos.py `
            -v `
            --html=report.html `
            --self-contained-html

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: report.html