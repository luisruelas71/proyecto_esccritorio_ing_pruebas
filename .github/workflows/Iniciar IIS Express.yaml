- name: Iniciar IIS Express
  shell: pwsh
  run: |
    Start-Process `
      "${env:ProgramFiles}\IIS Express\iisexpress.exe" `
      -ArgumentList "/path:${env:GITHUB_WORKSPACE}\Crud.WebForm", "/port:8080"

- name: Esperar servidor
  shell: pwsh
  run: |
    $url = "http://localhost:8080/vistas/Login/Login"

    for ($i = 0; $i -lt 40; $i++) {
      try {
        Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5
        exit 0
      }
      catch {
        Start-Sleep -Seconds 3
      }
    }

    throw "El servidor no inició correctamente"

- name: Ejecutar pruebas UI
  run: |
    python -m pytest `
      pruebas/test_ui_login.py `
      pruebas/test_ui_consulta_usuarios.py `
      pruebas/test_ui_consulta_productos.py `
      -v